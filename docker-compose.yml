services:
  easy-dune-admin:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        EDA_BUILD_REVISION: "${EDA_BUILD_REVISION:-unknown}"
        EDA_BUILD_DIRTY: "${EDA_BUILD_DIRTY:-unknown}"
    image: easy-dune-admin:0.8.8-beta
    container_name: easy-dune-admin
    restart: unless-stopped
    ports:
      - "${EDA_PORT:-8089}:8089"
    environment:
      # Generate a long random value before exposing outside a trusted LAN/VPN.
      DUNE_SECRET_KEY: "${DUNE_SECRET_KEY:-change-this-secret-before-sharing}"

      # RedBlink stack mounted inside this container. Keep this aligned with
      # the volume below and with your host's actual install path.
      DUNE_ROOT: "${DUNE_ROOT_CONTAINER:-${REDBLINK_HOST_DIR:-/home/steam/dune-awakening-selfhost-docker}}"
      REDBLINK_INSTALL_DIR: "${DUNE_ROOT_CONTAINER:-${REDBLINK_HOST_DIR:-/home/steam/dune-awakening-selfhost-docker}}"

      # Persistent Easy Dune Admin state lives outside the image. The named
      # volume below preserves users.db and logs across rebuilds.
      EDA_DATA_DIR: "/data"
      EDA_LOG_DIR: "/data/logs"

      # Enable command-backed panels. Browser host shell stays disabled by
      # default; turn on only on a trusted LAN/VPN.
      ENABLE_HOST_COMMAND_RUNNER: "${ENABLE_HOST_COMMAND_RUNNER:-1}"
      ENABLE_STACK_INSTALLER: "${ENABLE_STACK_INSTALLER:-0}"
      ENABLE_HOST_SHELL: "${ENABLE_HOST_SHELL:-0}"
      ENABLE_SELF_UPDATE: "${ENABLE_SELF_UPDATE:-1}"
      EASY_DUNE_HOST_DIR: "${EASY_DUNE_HOST_DIR:-}"
      EASY_DUNE_SOURCE_DIR: "${EASY_DUNE_SOURCE_DIR_CONTAINER:-/host-easy-dune-admin}"
      EASY_DUNE_UPDATER_IMAGE: "${EASY_DUNE_UPDATER_IMAGE:-docker:27.5.1-cli}"
      EASY_DUNE_RUNTIME_HELPER_IMAGE: "${EASY_DUNE_RUNTIME_HELPER_IMAGE:-easy-dune-admin:0.8.8-beta}"

      # Optional tuning defaults exposed by the app.
      DEFAULT_WATER_REFILL_AMOUNT: "${DEFAULT_WATER_REFILL_AMOUNT:-1000000}"
      MARKET_PRICE_MULTIPLIER: "${MARKET_PRICE_MULTIPLIER:-5}"
      POSTGRES_CONTAINER: "${POSTGRES_CONTAINER:-dune-postgres}"
      EASY_DUNE_DEFAULT_INSTALL_MODE: "${EASY_DUNE_DEFAULT_INSTALL_MODE:-docker}"
      EASY_DUNE_HYPERV_SSH_TARGET: "${EASY_DUNE_HYPERV_SSH_TARGET:-}"
      EASY_DUNE_HYPERV_DUNE_ROOT: "${EASY_DUNE_HYPERV_DUNE_ROOT:-/home/steam/dune-awakening-selfhost-docker}"
      EASY_DUNE_DEVELOPER_KEY_HASH: "${EASY_DUNE_DEVELOPER_KEY_HASH:-}"
    volumes:
      - easy-dune-admin-data:/data

      # Required for docker exec / docker ps / RedBlink manager actions.
      - /var/run/docker.sock:/var/run/docker.sock

      # Point REDBLINK_HOST_DIR at your host RedBlink install.
      - "${REDBLINK_HOST_DIR:-/home/steam/dune-awakening-selfhost-docker}:${DUNE_ROOT_CONTAINER:-${REDBLINK_HOST_DIR:-/home/steam/dune-awakening-selfhost-docker}}:rw"

      # Point EASY_DUNE_HOST_DIR at this Easy Dune Admin checkout on the host.
      # Docker-mode self-update uses this mount for read-only status display,
      # then starts a detached updater container against the same host path.
      - "${EASY_DUNE_HOST_DIR:-.}:${EASY_DUNE_SOURCE_DIR_CONTAINER:-/host-easy-dune-admin}:rw"
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  easy-dune-admin-data:
